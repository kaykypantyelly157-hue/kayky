name: Validate 2K Gestão

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - "2k-gestao/**"
      - ".github/workflows/validate-2k-gestao.yml"
  pull_request:
    paths:
      - "2k-gestao/**"
      - ".github/workflows/validate-2k-gestao.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 2k-gestao
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: 2k-gestao/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --progress=false

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

  database:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 2k-gestao
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Supabase CLI and PostgreSQL client
        run: |
          npx --yes supabase@2.121.0 --version
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y postgresql-client

      - name: Start isolated local Supabase
        run: npx --yes supabase@2.121.0 start --exclude storage-api,imgproxy,realtime,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Apply migrations and test Auth, RLS, stock, sales, service orders, and concurrency
        run: bash supabase/tests/validate_local.sh

      - name: Stop local Supabase
        if: always()
        run: npx --yes supabase@2.121.0 stop --no-backup
